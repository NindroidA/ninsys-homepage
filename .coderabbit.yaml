# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!dist/**"
    - "!bun.lock"
    - "!**/*.lock"
    - "!private/**"
    - "!src/_archive/**"
  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: >-
        This is a React 19 + TypeScript + Vite portfolio on Tailwind 4. Prefer function
        components and hooks, mobile-first Tailwind utilities (unprefixed = phone,
        sm:/md: scale up), and the current v2 primitives in src/components/ui
        (GlassPanel, Wordmark) over hand-rolled markup. src/components/shared/ui is the
        older kit and is not where new work goes. Flag: module-scope window/
        sessionStorage access (breaks future SSG/prerender), missing accessibility
        attributes (role, aria-label, focus traps) on interactive elements and modals,
        duplicated glassmorphism markup that should use GlassPanel, desktop-only sizing
        with no base-breakpoint value, and reads that swallow fetch errors into empty
        data.
    - path: ".github/workflows/**"
      instructions: >-
        Flag use of untrusted event input (titles, bodies, refs) directly in run:
        steps; require env-var indirection.
chat:
  auto_reply: true
