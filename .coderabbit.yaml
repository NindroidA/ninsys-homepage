# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - dev
  path_filters:
    - "!dist/**"
    - "!bun.lock"
    - "!**/*.lock"
    - "!private/**"
    - "!src/_archive/**"
  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: >-
        This is a React 19 + TypeScript + Vite portfolio. Prefer function components
        and hooks, Tailwind utility classes, and the shared design-system primitives in
        src/components/shared/ui over hand-rolled markup. Flag: module-scope window/
        sessionStorage access (breaks future SSG/prerender), missing accessibility
        attributes (role, aria-label, focus traps) on interactive elements and modals,
        duplicated glassmorphism markup that should use shared primitives, and reads
        that swallow fetch errors into empty data.
    - path: ".github/workflows/**"
      instructions: >-
        Flag use of untrusted event input (titles, bodies, refs) directly in run:
        steps; require env-var indirection.
chat:
  auto_reply: true
