server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # nginx does NOT inherit add_header into a location that declares its own.
    # Both cache locations below set Cache-Control, so declaring these only at
    # server level silently dropped them from every asset and HTML response.
    # Keep this list and the per-location copies in sync.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output only. public/ files are copied verbatim with no hash,
    # so an extension-based rule would pin them as immutable for a year and make
    # favicon/og-image effectively un-updatable.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Unhashed root-level assets: cache, but let them change.
    location ~* ^/(favicon\.svg|og-image\.png|robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # nginx:alpine's mime.types has no .webmanifest mapping, so this was served
    # as application/octet-stream.
    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Never cache the HTML entry point: it names the hashed assets.
    location ~* \.html$ {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/manifest+json
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # 404 is unreachable for route-like URLs — try_files already resolves them to
    # index.html with a 200 — so only the upstream-failure page is kept.
    error_page 500 502 503 504 /index.html;
}
