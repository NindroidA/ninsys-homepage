version: 2
updates:
  - package-ecosystem: "npm" # covers package.json + bun.lock
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Deliberate, dedicated migrations — handled in their own PRs, not grouped bumps.
      # These must ALSO be excluded from the groups below: a grouped bump otherwise
      # pulls the major in anyway, which is how vite 8 and typescript 7 ended up
      # inside a PR labelled "dev-dependencies".
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "tailwindcss"
          - "typescript"
          - "vite"
          - "@vitejs/plugin-react"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      three:
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
