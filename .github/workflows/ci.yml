name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome (lint + format check)
        # The backlog is at zero, so warnings are now a hard failure —
        # otherwise every rule in biome.json is severity "warn" and the gate
        # passes no matter how many accumulate.
        run: bunx biome ci --error-on-warnings .

      - name: Build (typecheck + bundle)
        run: bun run build
